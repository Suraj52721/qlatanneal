[build-system]
requires = ["scikit-build-core>=0.6", "pybind11>=2.11", "numpy>=1.24"]
build-backend = "scikit_build_core.build"

[project]
name = "qanneal"
version = "0.6.1"
description = "Research-grade simulated quantum annealing toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "qanneal contributors"}
]
keywords = [
  "quantum-annealing", "simulated-annealing", "ising", "qubo", "optimization",
  "parallel-tempering", "monte-carlo", "combinatorial-optimization",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

dependencies = ["numpy>=1.24"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.version = ">=3.18"
wheel.packages = ["python/qanneal"]
cmake.define = { QANNEAL_BUILD_PYTHON = "ON" }
# The SDist is built from git-tracked files (build artifacts and compiled extensions are
# gitignored). README/CHANGELOG/LICENSE/NOTICE are pulled in via the [project] metadata.
sdist.include = ["CHANGELOG.md"]
sdist.exclude = ["examples/**/*.png", "examples/**/*.json", "docs/latex", "notebooks"]
